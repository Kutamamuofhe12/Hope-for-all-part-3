    </header><main class="enquiry-page"><h1>Enquire about getting involved</h1><p>Choose a volunteer, sponsorship or programme enquiry. The estimate below is illustrative, not a payment request or confirmed quotation.</p><form id="enquiry-form" novalidate>
<label for="enquiry-name">Full name</label><input id="enquiry-name" name="name" required minlength="2">
<label for="enquiry-email">Email</label><input id="enquiry-email" type="email" name="email" required>
<label for="enquiry-kind">Enquiry type</label><select id="enquiry-kind" name="kind" required><option value="">Select an enquiry</option><option value="volunteer">Volunteering</option><option value="sponsor">Sponsorship</option><option value="programme">Programme information</option></select>
<label for="enquiry-people">Number of people interested</label><input id="enquiry-people" name="people" type="number" min="1" max="50" value="1" required>
<label for="enquiry-notes">Additional details</label><textarea id="enquiry-notes" name="notes" minlength="10" required></textarea>
<p id="enquiry-response" class="form-status" role="status" aria-live="polite"></p><button type="submit">Check enquiry details</button></form></main><footer>
